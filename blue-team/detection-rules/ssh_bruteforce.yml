title: SSH Brute Force - Multiple Failed Logins from Single Source
id: 8f3a2e10-6b2a-4e77-9b0a-1c1f5a9e0a11
status: experimental
description: >
    Detects a high volume of failed SSH authentication attempts from a single
    source IP within a short time window, indicating a likely brute-force
    or password-spraying attempt.
references:
    - https://sigmahq.io/
author: Owen Campbell
date: 2026-08-31
logsource:
    product: linux
    service: auth
detection:
    selection:
        # Matches lines like:
        # "Failed password for invalid user admin from 203.0.113.45 port 51422 ssh2"
        message|contains: 'Failed password for'
    timeframe: 5m
    condition: selection | count(message) by src_ip >= 5
falsepositives:
    - Legitimate user repeatedly mistyping their password
    - Misconfigured automated service retrying with stale credentials
level: medium
tags:
    - attack.credential_access
    - attack.t1110
